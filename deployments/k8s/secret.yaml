apiVersion: v1
kind: Secret
metadata:
  name: media-processor-secrets
  namespace: lowreyarchives
type: Opaque
stringData:
  # Database connection string
  # Format: postgres://user:password@host:port/dbname
  DATABASE_URL: "postgres://user:password@db-host:5432/lowreyarchives"

  # S3/Garage credentials
  S3_ACCESS_KEY: "your-access-key"
  S3_SECRET_KEY: "your-secret-key"
