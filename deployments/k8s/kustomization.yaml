apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lowreyarchives

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/part-of: lowreyarchives
  app.kubernetes.io/managed-by: kustomize

images:
  - name: lowreyarchives/media-processor
    newTag: latest
