apiVersion: v1
kind: ConfigMap
metadata:
  name: media-processor-config
  namespace: lowreyarchives
data:
  # S3/Garage configuration
  S3_ENDPOINT: "http://xynon-vm-storage.xynondc:3900"
  S3_REGION: "garage"
  S3_INGEST_BUCKET: "fa-dmz"
  S3_INGEST_PATH: "ingest"
  S3_MEDIA_BUCKET: "fa-media"
  S3_ARCHIVE_PATH: "archive"

  # Worker configuration
  WORKER_COUNT: "4"
  POLL_INTERVAL_SEC: "10"
  MAX_RETRIES: "3"

  # Video processing
  FFMPEG_PATH: "/usr/bin/ffmpeg"
  FFPROBE_PATH: "/usr/bin/ffprobe"
  VIDEO_OUTPUT_FORMAT: "mp4"
  VIDEO_CODEC: "libx264"
  VIDEO_PRESET: "medium"
  VIDEO_CRF: "20"
  AUDIO_CODEC: "aac"
  MAX_VIDEO_WIDTH: "1920"
  MAX_VIDEO_HEIGHT: "1080"

  # Image processing
  IMAGE_MAX_WIDTH: "2048"
  IMAGE_MAX_HEIGHT: "2048"
  IMAGE_QUALITY: "85"

  # Temp directory (matches PVC mount)
  TEMP_DIR: "/data/processing"

  # Health check
  HEALTH_PORT: "8080"

  # Logging
  LOG_LEVEL: "info"
