apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-processor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/evanlanglais/lowreyarchives-media.git
    targetRevision: master
    path: deployments/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: lowreyarchives
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
